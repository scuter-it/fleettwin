[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleettwin"
version = "0.1.0"
description = "GPU-batched simulator that scores operational plans for shared light-vehicle fleets under demand uncertainty"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "h3>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["fleettwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
